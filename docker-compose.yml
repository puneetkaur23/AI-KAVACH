version: '3.8'

services:
  validator:
    build:
      context: .
      dockerfile: sandbox/Dockerfile.validator
    image: ai-kavach-validator:latest
    container_name: kavach_validator
    volumes:
      # Mount entire project into /workspace
      - .:/workspace
      - kavach_output:/output
    working_dir: /workspace
    environment:
      - AFL_SKIP_CPUFREQ=1
      - AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1
      - ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:halt_on_error=1:symbolize=0
    # Needed for AFL++ ptrace
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
    restart: "no"
    command: bash

  fuzzer:
    build:
      context: .
      dockerfile: sandbox/Dockerfile.validator
    image: ai-kavach-validator:latest
    container_name: kavach_fuzzer
    volumes:
      - .:/workspace
      - kavach_fuzzer_out:/fuzzer_out
    working_dir: /workspace
    environment:
      - AFL_SKIP_CPUFREQ=1
      - AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1
      - AFL_NO_UI=1
      - ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:halt_on_error=1:symbolize=0
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: "no"
    command: tail -f /dev/null

volumes:
  kavach_output:
  kavach_fuzzer_out:
